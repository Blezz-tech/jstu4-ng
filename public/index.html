<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Эмулятор машины Тьюринга в четвёрках: учебный интерпретатор программ МТ"
    />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Ctext x='16' y='23' font-family='ui-monospace,monospace' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3E04%3C/text%3E%3C/svg%3E"
    />
    <title>Эмулятор машины Тьюринга в четвёрках</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#input-program">Программа</a>

    <div class="app">
      <header class="topbar">
        <h1 class="title">
          <span class="title__text" id="app-title"></span>
          <span class="title__version" id="app-version"></span>
        </h1>
        <nav class="topbar__actions" aria-label="UI">
          <div class="settings-anchor" id="settings-anchor">
            <button
              class="icon-btn"
              id="btn-settings"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="settings-menu"
            >
              <svg
                class="icon-btn__gear"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  fill="currentColor"
                  d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.55 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"
                />
              </svg>
            </button>

            <section
              class="settings-menu"
              id="settings-menu"
              role="dialog"
              aria-labelledby="settings-title"
              hidden
            >
              <header class="settings-menu__header">
                <h2 class="settings-menu__title" id="settings-title">Настройки</h2>
                <button
                  class="icon-btn settings-menu__close"
                  id="btn-settings-close"
                  type="button"
                  aria-label="Закрыть"
                >
                  ×
                </button>
              </header>

              <div class="settings-menu__body">
                <div class="setting-row">
                  <span class="setting-row__label" id="label-setting-lang">Язык</span>
                  <button class="btn btn--sm" id="btn-lang" type="button">
                    <span id="lang-label">Русский</span>
                  </button>
                </div>

                <div class="setting-row setting-row--stack">
                  <span class="setting-row__label" id="label-setting-theme">Тема</span>
                  <div
                    class="segmented"
                    id="theme-group"
                    role="group"
                    aria-labelledby="label-setting-theme"
                  >
                    <button
                      class="segmented__btn"
                      id="btn-theme-auto"
                      type="button"
                      data-theme-option="auto"
                      aria-pressed="false"
                    >
                      Авто
                    </button>
                    <button
                      class="segmented__btn"
                      id="btn-theme-light"
                      type="button"
                      data-theme-option="light"
                      aria-pressed="false"
                    >
                      Светлая
                    </button>
                    <button
                      class="segmented__btn"
                      id="btn-theme-dark"
                      type="button"
                      data-theme-option="dark"
                      aria-pressed="false"
                    >
                      Тёмная
                    </button>
                  </div>
                </div>

                <div class="setting-row">
                  <span class="setting-row__label" id="label-setting-sound">Звук шагов</span>
                  <button
                    class="switch"
                    id="btn-sound"
                    type="button"
                    role="switch"
                    aria-checked="false"
                    aria-labelledby="label-setting-sound"
                  >
                    <span class="switch__track" aria-hidden="true">
                      <span class="switch__thumb"></span>
                    </span>
                    <span class="switch__text" id="sound-label">Выкл</span>
                  </button>
                </div>

                <div class="setting-row">
                  <label
                    class="setting-row__label"
                    id="label-setting-max-speed"
                    for="input-max-speed"
                  >
                    Макс. скорость
                  </label>
                  <div class="setting-number">
                    <input
                      class="setting-number__input"
                      id="input-max-speed"
                      type="number"
                      min="1"
                      max="1000"
                      step="1"
                      value="10"
                      inputmode="decimal"
                    />
                    <span class="setting-number__unit" aria-hidden="true">×</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          <button class="btn btn--ghost" id="btn-help" type="button">?</button>
        </nav>
      </header>

      <main class="workspace">
        <section class="pane pane--tape">
          <label class="pane__label" for="input-tape" id="label-tape">Лента</label>
          <div class="pane__slot">
            <input
              class="field field--tape"
              id="input-tape"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="go"
              tabindex="1"
            />
            <div class="tape" id="display-tape" aria-live="polite"></div>
          </div>
        </section>

        <section class="pane pane--program">
          <label class="pane__label" for="input-program" id="label-program">Программа</label>
          <div class="pane__stack">
            <textarea
              class="field field--program"
              id="input-program"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              wrap="off"
              tabindex="2"
            ></textarea>
            <div class="program" id="display-program" tabindex="0"></div>
          </div>
        </section>
      </main>

      <footer class="toolbar">
        <div class="toolbar__buttons" id="controls">
          <button class="btn btn--primary" id="btn-start" type="button" data-mode="edit">
            <span class="btn__text">Старт</span>
          </button>
          <button class="btn" id="btn-totu4" type="button" data-mode="edit">
            <span class="btn__text">В формат TU4</span>
          </button>
          <button class="btn" id="btn-copy" type="button" data-mode="edit">
            <span class="btn__text">Копировать</span>
          </button>
          <button class="btn btn--primary" id="btn-step" type="button" data-mode="run">
            <span class="btn__text">Шаг</span>
          </button>
          <button class="btn" id="btn-run-toggle" type="button" data-mode="run">
            <span class="btn__text">Запуск</span>
          </button>
          <label class="speed-control" id="speed-control" data-mode="run" for="input-speed">
            <span class="speed-control__label" id="label-speed">Скорость</span>
            <input
              class="speed-control__slider"
              id="input-speed"
              type="range"
              min="0.5"
              max="10"
              step="0.5"
              value="1"
            />
            <output class="speed-control__value" id="speed-value" for="input-speed">1×</output>
          </label>
          <button class="btn" id="btn-unmark" type="button" data-mode="run">
            <span class="btn__text">Сбросить метки</span>
          </button>
          <button class="btn" id="btn-edit" type="button" data-mode="run">
            <span class="btn__text">К правке</span>
          </button>
          <button class="btn" id="btn-edit-err" type="button" data-mode="error">
            <span class="btn__text">К правке</span>
          </button>
        </div>
        <div class="toolbar__status">
          <p class="log" id="log" role="status" aria-live="polite"></p>
          <p class="stats" id="stats"></p>
          <p class="hint" id="hint" aria-hidden="true"></p>
        </div>
      </footer>
    </div>

    <dialog class="help" id="help-dialog" aria-labelledby="help-title" tabindex="-1">
      <div class="help__inner">
        <header class="help__header">
          <h2 id="help-title"></h2>
          <button class="icon-btn" id="btn-help-close" type="button" aria-label="Close">×</button>
        </header>
        <div class="help__body" id="help-body"></div>
        <footer class="help__footer">
          <button class="btn" id="btn-help-back" type="button"></button>
        </footer>
      </div>
    </dialog>

    <noscript>
      <p class="noscript">Для работы эмулятора нужен JavaScript. / JavaScript is required.</p>
    </noscript>
  </body>
</html>
